autoware_system_design_format: 0.3.1

# module information
name: ExternalCommand.module

instances:
  - name: external_cmd_converter_local
    entity: ExternalCmdConverter.node
  - name: external_cmd_converter_remote
    entity: ExternalCmdConverter.node

# interfaces
subscribers:
  - name: local/pedals_cmd
  - name: local/steering_cmd
  - name: local/gear_cmd
  - name: local/heartbeat
  - name: remote/pedals_cmd
  - name: remote/steering_cmd
  - name: remote/gear_cmd
  - name: remote/heartbeat
  - name: current_gate_mode
  - name: odometry

publishers:
  - name: local/control_cmd
  - name: remote/control_cmd

connections:
  # ExternalCmdConverter (local)
  - - subscriber.local/pedals_cmd
    - external_cmd_converter_local.subscriber.pedals_cmd
  - - subscriber.local/steering_cmd
    - external_cmd_converter_local.subscriber.steering_cmd
  - - subscriber.local/gear_cmd
    - external_cmd_converter_local.subscriber.gear_cmd
  - - subscriber.local/heartbeat
    - external_cmd_converter_local.subscriber.heartbeat
  - - subscriber.current_gate_mode
    - external_cmd_converter_local.subscriber.current_gate_mode
  - - subscriber.odometry
    - external_cmd_converter_local.subscriber.odometry
  - - external_cmd_converter_local.publisher.control_cmd
    - publisher.local/control_cmd

  # ExternalCmdConverter (remote)
  - - subscriber.remote/pedals_cmd
    - external_cmd_converter_remote.subscriber.pedals_cmd
  - - subscriber.remote/steering_cmd
    - external_cmd_converter_remote.subscriber.steering_cmd
  - - subscriber.remote/gear_cmd
    - external_cmd_converter_remote.subscriber.gear_cmd
  - - subscriber.remote/heartbeat
    - external_cmd_converter_remote.subscriber.heartbeat
  - - subscriber.current_gate_mode
    - external_cmd_converter_remote.subscriber.current_gate_mode
  - - subscriber.odometry
    - external_cmd_converter_remote.subscriber.odometry
  - - external_cmd_converter_remote.publisher.control_cmd
    - publisher.remote/control_cmd

autoware_system_design_format: 0.3.1

# module information
name: CommandGate.module

instances:
  - name: shift_decider
    entity: ShiftDecider.node
  - name: control_command_gate
    entity: ControlCommandGate.node
  - name: autoware_operation_mode_transition_manager
    entity: AutonomousModeTransitionFlag.node
  - name: stop_mode_operator
    entity: StopModeOperator.node

# interfaces
subscribers:
  - name: control_cmd
  - name: trajectory
  - name: odometry
  - name: acceleration
  - name: steering_status
  - name: velocity_status
  - name: gear_status
  - name: control_mode_report
  - name: autoware_state
  - name: route_state
  - name: planning_turn_indicators_cmd
  - name: hazard_lights_cmd

  - name: local/control_cmd
  - name: local/gear_cmd
  - name: local/turn_indicators_cmd
  - name: local/hazard_lights_cmd

  - name: remote/control_cmd
  - name: remote/gear_cmd
  - name: remote/turn_indicators_cmd
  - name: remote/hazard_lights_cmd

  - name: emergency_control_cmd
  - name: emergency_turn_indicators_cmd
  - name: emergency_hazard_lights_cmd
  - name: emergency_gear_cmd

  - name: driving_mode/info

publishers:
  - name: command/control_cmd
  - name: command/gear_cmd
  - name: command/turn_indicators_cmd
  - name: command/hazard_lights_cmd
  - name: external_emergency
  - name: is_paused
  - name: is_start_requested
  - name: is_stopped
  - name: driving_mode/stable
  - name: command/source/status
  - name: command/filter/status

servers:
  - name: external_emergency_service
  - name: set_pause
  - name: set_stop
  - name: command/source/change
  - name: command/filter/change

connections:
  # ShiftDecider
  - - subscriber.control_cmd
    - shift_decider.subscriber.trajectory_follower_control_cmd
  - - subscriber.gear_status
    - shift_decider.subscriber.current_gear
  - - subscriber.autoware_state
    - shift_decider.subscriber.autoware/state

  # ControlCommandGate: main source
  - - subscriber.control_cmd
    - control_command_gate.subscriber.main_control
  - - shift_decider.publisher.gear_cmd
    - control_command_gate.subscriber.main_gear
  - - subscriber.planning_turn_indicators_cmd
    - control_command_gate.subscriber.main_turn_indicators
  - - subscriber.hazard_lights_cmd
    - control_command_gate.subscriber.main_hazard_lights

  # ControlCommandGate: local source
  - - subscriber.local/control_cmd
    - control_command_gate.subscriber.local_control
  - - subscriber.local/gear_cmd
    - control_command_gate.subscriber.local_gear
  - - subscriber.local/turn_indicators_cmd
    - control_command_gate.subscriber.local_turn_indicators
  - - subscriber.local/hazard_lights_cmd
    - control_command_gate.subscriber.local_hazard_lights

  # ControlCommandGate: remote source
  - - subscriber.remote/control_cmd
    - control_command_gate.subscriber.remote_control
  - - subscriber.remote/gear_cmd
    - control_command_gate.subscriber.remote_gear
  - - subscriber.remote/turn_indicators_cmd
    - control_command_gate.subscriber.remote_turn_indicators
  - - subscriber.remote/hazard_lights_cmd
    - control_command_gate.subscriber.remote_hazard_lights

  # ControlCommandGate: stop source
  - - stop_mode_operator.publisher.control
    - control_command_gate.subscriber.stop_control
  - - stop_mode_operator.publisher.gear
    - control_command_gate.subscriber.stop_gear
  - - stop_mode_operator.publisher.turn_indicators
    - control_command_gate.subscriber.stop_turn_indicators
  - - stop_mode_operator.publisher.hazard_lights
    - control_command_gate.subscriber.stop_hazard_lights

  # ControlCommandGate: emergency stop source
  - - subscriber.emergency_control_cmd
    - control_command_gate.subscriber.emergency_stop_control
  - - subscriber.emergency_gear_cmd
    - control_command_gate.subscriber.emergency_stop_gear
  - - subscriber.emergency_turn_indicators_cmd
    - control_command_gate.subscriber.emergency_stop_turn_indicators
  - - subscriber.emergency_hazard_lights_cmd
    - control_command_gate.subscriber.emergency_stop_hazard_lights

  # ControlCommandGate: vehicle status
  - - subscriber.odometry
    - control_command_gate.subscriber.kinematics
  - - subscriber.acceleration
    - control_command_gate.subscriber.acceleration
  - - subscriber.steering_status
    - control_command_gate.subscriber.steering
  - - subscriber.control_mode_report
    - control_command_gate.subscriber.control_mode

  # AutonomousModeTransitionFlag
  - - subscriber.trajectory
    - autoware_operation_mode_transition_manager.subscriber.trajectory
  - - subscriber.odometry
    - autoware_operation_mode_transition_manager.subscriber.kinematics
  - - control_command_gate.publisher.control
    - autoware_operation_mode_transition_manager.subscriber.control_cmd
  - - subscriber.control_cmd
    - autoware_operation_mode_transition_manager.subscriber.trajectory_follower_control_cmd
  - - subscriber.driving_mode/info
    - autoware_operation_mode_transition_manager.subscriber.driving_mode_info

  # StopModeOperator
  - - subscriber.route_state
    - stop_mode_operator.subscriber.route_state
  - - subscriber.steering_status
    - stop_mode_operator.subscriber.steering
  - - subscriber.velocity_status
    - stop_mode_operator.subscriber.velocity

  # API ports
  - - control_command_gate.publisher.external_emergency
    - publisher.external_emergency
  - - control_command_gate.server.external_emergency_service
    - server.external_emergency_service
  - - control_command_gate.publisher.is_paused
    - publisher.is_paused
  - - control_command_gate.publisher.is_start_requested
    - publisher.is_start_requested
  - - control_command_gate.publisher.is_stopped
    - publisher.is_stopped
  - - control_command_gate.server.set_pause
    - server.set_pause
  - - control_command_gate.server.set_stop
    - server.set_stop

  # driving mode management ports
  - - autoware_operation_mode_transition_manager.publisher.driving_mode_stable
    - publisher.driving_mode/stable
  - - control_command_gate.publisher.source_status
    - publisher.command/source/status
  - - control_command_gate.publisher.filter_status
    - publisher.command/filter/status
  - - control_command_gate.server.source_change
    - server.command/source/change
  - - control_command_gate.server.filter_change
    - server.command/filter/change

  # Publishers
  - - control_command_gate.publisher.control
    - publisher.command/control_cmd
  - - control_command_gate.publisher.gear
    - publisher.command/gear_cmd
  - - control_command_gate.publisher.turn_indicators
    - publisher.command/turn_indicators_cmd
  - - control_command_gate.publisher.hazard_lights
    - publisher.command/hazard_lights_cmd
